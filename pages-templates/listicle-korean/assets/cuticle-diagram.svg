<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 558" width="900" height="558" role="img" aria-label="Diagram of a hair cuticle with scales lying flat versus lifted scales letting moisture escape after repeated coloring">
  <defs>
    <path id="tileFlat" d="M0 0 L46 0 L52 -14 L6 -14 Z" fill="#dbe4dc" stroke="#7f9686" stroke-width="1.4" stroke-linejoin="round"/>
    <g id="tileLift"><path transform="rotate(-34)" d="M0 0 L46 0 L52 -12 L6 -12 Z" fill="#eed2c8" stroke="#c08370" stroke-width="1.4" stroke-linejoin="round"/></g>
    <path id="drop" d="M0 -11 C5 -4 6.5 -1 6.5 1 A6.5 6.5 0 0 1 -6.5 1 C-6.5 -1 -5 -4 0 -11 Z"/>
    <linearGradient id="strandHealthy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b4d41"/>
      <stop offset="0.45" stop-color="#3f342c"/>
      <stop offset="1" stop-color="#2c241e"/>
    </linearGradient>
    <linearGradient id="strandTired" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a5a4d"/>
      <stop offset="0.45" stop-color="#544639"/>
      <stop offset="1" stop-color="#3d3229"/>
    </linearGradient>
    <clipPath id="clipTop"><rect x="50" y="146" width="798" height="48"/></clipPath>
    <clipPath id="clipBottom"><rect x="50" y="368" width="798" height="54"/></clipPath>
  </defs>
  <g font-family="DM Sans, Segoe UI, Arial, sans-serif">
    <text x="450" y="44" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="4" fill="#6b6963">THE CUTICLE &#8212; YOUR HAIR&#8217;S ROOF TILES</text>

    <!-- row 1: closed -->
    <rect x="26" y="66" width="848" height="216" rx="6" fill="#fdfaf4" stroke="#e3ddd1" stroke-width="1.5"/>
    <rect x="50" y="88" width="176" height="26" rx="13" fill="#3f5a4b"/>
    <text x="138" y="106" text-anchor="middle" font-size="11" font-weight="800" letter-spacing="1.1" fill="#ffffff">CUTICLE CLOSED</text>
    <text x="848" y="106" text-anchor="end" font-size="12" font-weight="700" fill="#3f5a4b">Moisture stays in</text>
    <rect x="50" y="194" width="798" height="52" rx="10" fill="url(#strandHealthy)"/>
    <rect x="50" y="200" width="798" height="8" rx="4" fill="#ffffff" opacity="0.12"/>
    <g clip-path="url(#clipTop)">
      <use href="#tileFlat" x="50" y="194"/><use href="#tileFlat" x="84" y="194"/><use href="#tileFlat" x="118" y="194"/><use href="#tileFlat" x="152" y="194"/>
      <use href="#tileFlat" x="186" y="194"/><use href="#tileFlat" x="220" y="194"/><use href="#tileFlat" x="254" y="194"/><use href="#tileFlat" x="288" y="194"/>
      <use href="#tileFlat" x="322" y="194"/><use href="#tileFlat" x="356" y="194"/><use href="#tileFlat" x="390" y="194"/><use href="#tileFlat" x="424" y="194"/>
      <use href="#tileFlat" x="458" y="194"/><use href="#tileFlat" x="492" y="194"/><use href="#tileFlat" x="526" y="194"/><use href="#tileFlat" x="560" y="194"/>
      <use href="#tileFlat" x="594" y="194"/><use href="#tileFlat" x="628" y="194"/><use href="#tileFlat" x="662" y="194"/><use href="#tileFlat" x="696" y="194"/>
      <use href="#tileFlat" x="730" y="194"/><use href="#tileFlat" x="764" y="194"/><use href="#tileFlat" x="798" y="194"/>
    </g>
    <g fill="#8fb4d4" opacity="0.72">
      <use href="#drop" x="176" y="228"/><use href="#drop" x="368" y="228"/><use href="#drop" x="560" y="228"/><use href="#drop" x="742" y="228"/>
    </g>
    <text x="50" y="270" font-size="12.5" fill="#4b4943">Overlapping scales lie flat over each other. Hair looks smooth and shiny, and moisture is held inside the strand.</text>

    <!-- row 2: lifted -->
    <rect x="26" y="298" width="848" height="236" rx="6" fill="#fdfaf4" stroke="#e3ddd1" stroke-width="1.5"/>
    <rect x="50" y="320" width="330" height="26" rx="13" fill="#a94c33"/>
    <text x="215" y="338" text-anchor="middle" font-size="11" font-weight="800" letter-spacing="1.1" fill="#ffffff">CUTICLE LIFTED &#183; AFTER REPEATED COLOR</text>
    <text x="848" y="338" text-anchor="end" font-size="12" font-weight="700" fill="#a94c33">Moisture escapes</text>
    <g fill="#8fb4d4" opacity="0.8">
      <use href="#drop" x="150" y="376"/><use href="#drop" x="300" y="366"/><use href="#drop" x="452" y="378"/><use href="#drop" x="604" y="368"/>
    </g>
    <g stroke="#a94c33" stroke-width="1.4" opacity="0.5">
      <path d="M150 392 L150 384"/><path d="M300 382 L300 374"/><path d="M452 394 L452 386"/><path d="M604 384 L604 376"/>
    </g>
    <rect x="50" y="422" width="740" height="52" rx="10" fill="url(#strandTired)"/>
    <rect x="50" y="428" width="740" height="6" rx="3" fill="#ffffff" opacity="0.07"/>
    <path d="M790 422 L774 448 L790 474 Z" fill="#fdfaf4"/>
    <g transform="rotate(13 828 448)"><rect x="802" y="422" width="46" height="52" rx="10" fill="url(#strandTired)"/><path d="M802 422 L818 448 L802 474 Z" fill="#fdfaf4"/></g>
    <g clip-path="url(#clipBottom)">
      <use href="#tileLift" x="54" y="422"/><use href="#tileLift" x="94" y="422"/><use href="#tileLift" x="134" y="422"/><use href="#tileLift" x="174" y="422"/>
      <use href="#tileLift" x="214" y="422"/><use href="#tileLift" x="254" y="422"/><use href="#tileLift" x="294" y="422"/><use href="#tileLift" x="334" y="422"/>
      <use href="#tileLift" x="374" y="422"/><use href="#tileLift" x="414" y="422"/><use href="#tileLift" x="454" y="422"/><use href="#tileLift" x="494" y="422"/>
      <use href="#tileLift" x="534" y="422"/><use href="#tileLift" x="574" y="422"/><use href="#tileLift" x="614" y="422"/><use href="#tileLift" x="654" y="422"/>
      <use href="#tileLift" x="694" y="422"/><use href="#tileLift" x="734" y="422"/>
    </g>
    <line x1="792" y1="492" x2="820" y2="492" stroke="#a94c33" stroke-width="1.5"/>
    <text x="826" y="496" font-size="11" font-weight="700" fill="#a94c33">Snaps</text>
    <text x="50" y="498" font-size="12.5" fill="#4b4943">Ammonia lifts the scales so color can get underneath. Repeat it often enough and they stop closing properly.</text>
    <text x="50" y="516" font-size="12.5" fill="#4b4943">Moisture escapes, the strand goes dry, porous and brittle &#8212; and then it breaks off partway down.</text>
  </g>
</svg>
